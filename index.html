<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C Major Scale for Guitar | Fretboard Visualizer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="controls">
            <div class="control-row">
                <div class="control-group">
                    <h3>Note</h3>
                    <div class="accidentals">
                        <label><input type="radio" name="accidental" value="natural" checked> ♮</label>
                        <label><input type="radio" name="accidental" value="sharp"> ♯</label>
                        <label><input type="radio" name="accidental" value="flat"> ♭</label>
                    </div>
                    <div class="note-buttons">
                        <button class="note-btn" data-note="C">C</button>
                        <button class="note-btn" data-note="D">D</button>
                        <button class="note-btn" data-note="E">E</button>
                        <button class="note-btn" data-note="F">F</button>
                        <button class="note-btn" data-note="G">G</button>
                        <button class="note-btn" data-note="A">A</button>
                        <button class="note-btn" data-note="B">B</button>
                    </div>
                </div>

                <div class="control-group">
                    <h3>Scale / Mode</h3>
                    <select id="scale">
                        <option value="major">Major</option>
                        <option value="naturalMinor">Natural Minor</option>
                        <option value="harmonicMinor">Harmonic Minor</option>
                        <option value="melodicMinor">Melodic Minor</option>
                        <option value="dorian">Dorian</option>
                        <option value="phrygian">Phrygian</option>
                        <option value="lydian">Lydian</option>
                        <option value="mixolydian">Mixolydian</option>
                        <option value="locrian">Locrian</option>
                    </select>
                </div>
            </div>

            <div class="control-group">
                <h3>Display</h3>
                <div class="toggle-group">
                    <label><input type="radio" name="displayMode" value="rootNote" id="rootNote" checked> Root</label>
                    <label><input type="radio" name="displayMode" value="allNotes" id="allNotes"> All Notes</label>
                </div>
            </div>
        </div>

        <div class="scale-chords-section">
            <h2 id="scaleName">C Major Scale</h2>
            <div class="scale-display-mode">
                <label><input type="radio" name="scaleMode" value="chords" checked> Chords</label>
                <label><input type="radio" name="scaleMode" value="notes"> Notes</label>
                <label><input type="radio" name="scaleMode" value="degrees"> Degrees</label>
                <div class="seventh-toggle">
                    <input type="checkbox" id="seventhMode">
                    <label class="toggle-track" for="seventhMode"></label>
                    <span class="toggle-label">Seventh</span>
                </div>
            </div>
            <div id="scaleContent" class="chord-grid">
                <!-- 动态内容 -->
            </div>
        </div>

        <div class="fretboard-container">
            <div id="fretboard"></div>
        </div>

        <div class="save-tabs-container">
            <div class="tabs-header">
                <div class="tab active" data-tab="current">当前标记</div>
                <div class="tab" data-tab="saved">已保存</div>
            </div>
            
            <div class="tabs-content">
                <div class="tab-panel active" id="currentPanel">
                    <div class="mark-controls">
                        <div class="mark-controls-row">
                            <div class="color-dots" id="colorDots">
                                <div class="color-dot active" data-color="#FFB6C1" style="background: #FFB6C1;"></div>
                                <div class="color-dot" data-color="#87CEEB" style="background: #87CEEB;"></div>
                                <div class="color-dot" data-color="#FFA500" style="background: #FFA500;"></div>
                                <div class="color-dot" data-color="#4169E1" style="background: #4169E1;"></div>
                                <div class="color-dot" data-color="#9370DB" style="background: #9370DB;"></div>
                            </div>
                            <button id="clearButton" class="clear-btn">清空</button>
                        </div>
                    </div>
                    <div class="save-controls">
                        <input type="text" id="saveName" placeholder="输入名称...">
                        <input type="number" id="saveMinFret" placeholder="起始品" min="0" max="22" value="0">
                        <span class="fret-separator">-</span>
                        <input type="number" id="saveMaxFret" placeholder="结束品" min="0" max="22" value="22">
                        <select id="saveTargetFolder" class="save-target-folder" title="保存到分类">
                            <option value="root">未分类</option>
                        </select>
                        <button id="saveButton">保存</button>
                    </div>
                </div>
                
                <div class="tab-panel" id="savedPanel">
                    <div class="saved-panel-header">
                        <button id="newFolderBtn" class="folder-create-btn" title="新建分类">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                                <line x1="12" y1="11" x2="12" y2="17"/>
                                <line x1="9" y1="14" x2="15" y2="14"/>
                            </svg>
                            <span>新建分类</span>
                        </button>
                        <div class="layout-controls">
                            <button class="layout-btn" data-columns="1" title="1列">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="3" width="18" height="6" rx="2"/>
                                    <rect x="3" y="11" width="18" height="6" rx="2"/>
                                    <rect x="3" y="19" width="18" height="6" rx="2"/>
                                </svg>
                            </button>
                            <button class="layout-btn" data-columns="2" title="2列">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="3" width="8" height="6" rx="2"/>
                                    <rect x="13" y="3" width="8" height="6" rx="2"/>
                                    <rect x="3" y="11" width="8" height="6" rx="2"/>
                                    <rect x="13" y="11" width="8" height="6" rx="2"/>
                                    <rect x="3" y="19" width="8" height="6" rx="2"/>
                                    <rect x="13" y="19" width="8" height="6" rx="2"/>
                                </svg>
                            </button>
                            <button class="layout-btn active" data-columns="3" title="3列">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="3" width="5" height="6" rx="2"/>
                                    <rect x="9.5" y="3" width="5" height="6" rx="2"/>
                                    <rect x="16" y="3" width="5" height="6" rx="2"/>
                                    <rect x="3" y="11" width="5" height="6" rx="2"/>
                                    <rect x="9.5" y="11" width="5" height="6" rx="2"/>
                                    <rect x="16" y="11" width="5" height="6" rx="2"/>
                                    <rect x="3" y="19" width="5" height="6" rx="2"/>
                                    <rect x="9.5" y="19" width="5" height="6" rx="2"/>
                                    <rect x="16" y="19" width="5" height="6" rx="2"/>
                                </svg>
                            </button>
                        </div>
                        <button class="cloud-sync-btn" onclick="showCloudSyncModal()" title="云同步">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>
                            </svg>
                            <span>云同步</span>
                        </button>
                    </div>
                    <div id="savedList">
                        <div class="empty-state">暂无保存的标记</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="context-menu" id="contextMenu">
        <div class="context-item" id="ctxDelete">删除此标记</div>
        <div class="context-item" id="ctxCancel">取消</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="supabase-config.js"></script>
    <script src="script.js"></script>
</body>
</html>
